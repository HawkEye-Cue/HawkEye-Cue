name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @social-lead-gen/shared run build

      - name: Build CDK package
        run: pnpm --filter @social-lead-gen/cdk run build

      - name: Deploy CDK stack (Lambdas + API + EventBridge)
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          # Cognito verification email via SES. Leave these secrets UNSET to keep
          # the safe built-in Cognito email. Set COGNITO_SES_EMAIL to
          # "no-reply@hawkeyecue.com" only AFTER the SES domain is verified and
          # the account is out of the SES sandbox.
          COGNITO_SES_EMAIL: ${{ secrets.COGNITO_SES_EMAIL }}
          COGNITO_SES_REPLY_TO: ${{ secrets.COGNITO_SES_REPLY_TO }}
          COGNITO_SES_REGION: ${{ secrets.COGNITO_SES_REGION }}
        run: cd packages/cdk && npx cdk deploy --all --require-approval never --hotswap-fallback || echo "CDK deploy failed - continuing with web deploy"

      - name: Build web app
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ secrets.VITE_COGNITO_REGION }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_MEDIA_BUCKET_URL: ${{ secrets.VITE_MEDIA_BUCKET_URL }}
        run: pnpm --filter @social-lead-gen/web run build

      - name: Deploy to S3
        run: aws s3 sync apps/web/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
