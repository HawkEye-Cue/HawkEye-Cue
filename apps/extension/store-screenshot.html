<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1280px;
  height: 800px;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Subtle grid */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
  background-size: 40px 40px;
}

/* Glow */
.glow {
  position: absolute;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 800px;
}

.hawk {
  font-size: 96px;
  margin-bottom: 24px;
}

h1 {
  font-size: 56px;
  font-weight: 800;
  background: linear-gradient(135deg, #f59e0b, #ea580c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 16px;
  letter-spacing: -1px;
}

.tagline {
  font-size: 24px;
  color: #94a3b8;
  margin-bottom: 48px;
  line-height: 1.4;
}

.features {
  display: flex;
  gap: 32px;
  justify-content: center;
}

.feature {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px;
  width: 200px;
  text-align: center;
}

.feature-icon {
  font-size: 32px;
  margin-bottom: 12px;
}

.feature-text {
  font-size: 14px;
  color: #cbd5e1;
  line-height: 1.4;
}

.badge {
  position: absolute;
  top: 40px;
  right: 60px;
  background: linear-gradient(135deg, #f59e0b, #ea580c);
  color: #000;
  font-size: 13px;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: 20px;
}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="badge">Chrome Extension</div>
  <div class="container">
    <div class="hawk">🦅</div>
    <h1>HawkEye-Cue</h1>
    <p class="tagline">Detect leads while scrolling social media.<br>A hawk icon appears when someone needs your services.</p>
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🔍</div>
        <div class="feature-text">Keyword scanning on Facebook, Instagram, LinkedIn & TikTok</div>
      </div>
      <div class="feature">
        <div class="feature-icon">💼</div>
        <div class="feature-text">Save leads with one click directly from your feed</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🙏</div>
        <div class="feature-text">Track appreciations when people tag your business</div>
      </div>
    </div>
  </div>
</body>
</html>
