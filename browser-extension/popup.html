<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #E2E8F0;
    }
    .header h1 {
      font-size: 18px;
      font-weight: bold;
      color: #0F172A;
      margin: 0;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #F0F9FF;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status.active {
      background: #F0FDF4;
    }
    .status.inactive {
      background: #FEF3C7;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22C55E;
    }
    .dot.inactive {
      background: #F59E0B;
    }
    .button {
      width: 100%;
      padding: 10px;
      background: #1D4ED8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .button:hover {
      background: #1E40AF;
    }
    .button.secondary {
      background: #F1F5F9;
      color: #0F172A;
    }
    .button.secondary:hover {
      background: #E2E8F0;
    }
    .button.small {
      font-size: 12px;
      padding: 6px 10px;
    }
    .keywords {
      margin-top: 12px;
    }
    .keyword-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .keyword-tag {
      padding: 4px 8px;
      background: #E0E7FF;
      color: #3730A3;
      border-radius: 4px;
      font-size: 12px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .stat-card {
      padding: 12px;
      background: #F8FAFC;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #1D4ED8;
    }
    .stat-label {
      font-size: 11px;
      color: #64748B;
      margin-top: 4px;
    }
    .footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #E2E8F0;
      text-align: center;
      font-size: 11px;
      color: #64748B;
    }
    .sync-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
    }
    .sync-modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sync-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
    }
    .sync-content h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #0F172A;
    }
    .sync-content textarea {
      width: 100%;
      height: 80px;
      padding: 8px;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      resize: none;
      margin-bottom: 12px;
    }
    .sync-buttons {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 24px;">🦅</span>
    <h1>HawkEye-Cue</h1>
  </div>

  <div id="status" class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Checking status...</span>
  </div>

  <button class="button" id="scanNow">🔍 Scan Page Now</button>
  <button class="button secondary" id="syncKeywords">📥 Import Keywords from App</button>
  <button class="button secondary" id="openApp">Open HawkEye-Cue App</button>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="opportunityCount">0</div>
      <div class="stat-label">Leads Found</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="keywordCount">0</div>
      <div class="stat-label">Keywords</div>
    </div>
  </div>

  <div class="keywords">
    <strong style="font-size: 13px; color: #0F172A;">Active Keywords:</strong>
    <div class="keyword-list" id="keywordList"></div>
  </div>

  <div class="footer">
    💡 Add keywords in the app, then click Import
  </div>

  <!-- Sync Modal -->
  <div class="sync-modal" id="syncModal">
    <div class="sync-content">
      <h3>Paste Keywords</h3>
      <p style="font-size: 12px; color: #64748B; margin: 0 0 8px 0;">
        Enter keywords separated by commas:
      </p>
      <textarea id="keywordInput" placeholder="roof leak, need a roofer, storm damage"></textarea>
      <div class="sync-buttons">
        <button class="button" id="importBtn" style="flex: 1;">Import</button>
        <button class="button secondary" id="cancelBtn" style="flex: 1;">Cancel</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
