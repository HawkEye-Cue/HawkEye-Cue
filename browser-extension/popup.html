<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; background: #f8fafc; }
    h1 { font-size: 18px; color: #2563eb; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #64748b; margin-bottom: 16px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .stat { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
    .stat-label { font-size: 13px; color: #64748b; }
    .stat-value { font-size: 14px; font-weight: 600; color: #2563eb; }
    .status { font-size: 12px; color: #10b981; padding: 4px 0; }
    input { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #f1f5f9; color: #475569; margin-top: 8px; }
    .btn-danger { background: #fff; color: #ef4444; border: 1px solid #ef4444; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Social Lead Gen</h1>
  <p class="subtitle">Keyword Detection Extension</p>

  <!-- Login Section -->
  <div id="login-section" style="display:none;">
    <div id="login-error" style="display:none; background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:8px; border-radius:8px; font-size:12px; margin-bottom:8px;"></div>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>
  </div>

  <!-- Main Section -->
  <div id="main-section" style="display:none;">
    <div class="card">
      <div class="stat">
        <span class="stat-label">Keywords Tracked</span>
        <span class="stat-value" id="keyword-count">0</span>
      </div>
      <div class="status" id="status-text">Active — scanning for keywords</div>
    </div>

    <button id="scan-btn" class="btn-primary">Scan Current Page</button>
    <button id="logout-btn" class="btn-danger">Log Out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
