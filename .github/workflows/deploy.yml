name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy the CDK backend (Lambdas/API/EventBridge). Only enable after reviewing the cdk diff / change set. Leave false for web-only deploys.'
        type: boolean
        default: false
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @social-lead-gen/shared run build

      - name: Build CDK package
        run: pnpm --filter @social-lead-gen/cdk run build

      # Read-only visibility: show the CloudFormation changeset this deploy WOULD apply.
      # This does NOT deploy and does NOT reconcile drift. It is advisory only — a failed
      # diff must not block the pipeline, so its output is always surfaced to the log and
      # the step never fails the job (Step 1 of deploy hardening; deploy command unchanged).
      # NOTE: `cdk diff` compares synthesized templates to the deployed CloudFormation
      # template; it is NOT CloudFormation drift detection and does not prove that live
      # resources match the templates.
      - name: CDK diff (read-only, advisory)
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: |
          cd packages/cdk
          echo "::group::cdk diff (advisory, non-blocking)"
          # `cdk diff` exits non-zero when there ARE differences, and also on genuine
          # synth/credential errors. Either way this is advisory: capture the status,
          # always print the output, and never fail the job.
          # NOTE: `--all` is not a valid flag for `cdk diff` (diff already covers all
          # stacks); passing it was silently ignored. Use plain `cdk diff`.
          npx cdk diff 2>&1; diff_status=$?
          echo "cdk diff exit status: $diff_status (non-zero may mean 'changes detected' OR a diff error — review output above)"
          if [ "$diff_status" -ne 0 ]; then
            echo "::warning::cdk diff reported changes or could not be generated (advisory only; does not block deploy; NOT CloudFormation drift detection)"
          fi
          echo "::endgroup::"
          exit 0

      # Backend (CDK) deploy — GATED and FAIL-STOP (deploy hardening Step 2).
      #
      # This step ONLY runs on a manual workflow_dispatch with deploy_backend=true, so a
      # routine push to main never silently mutates backend infrastructure. Trigger it
      # deliberately AFTER reviewing the advisory `cdk diff` / CloudFormation change set.
      #
      # Hardening changes vs. the previous pipeline:
      #   - Removed `|| echo "CDK deploy failed ..."` — a backend failure now FAILS the
      #     job and stops before the web deploy, so we never ship a frontend against a
      #     backend that did not update.
      #   - Removed `--hotswap-fallback` — hotswap can introduce CloudFormation drift and
      #     is not safe for production releases; use a normal CloudFormation deployment.
      - name: Deploy CDK stack (Lambdas + API + EventBridge)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_backend }}
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: cd packages/cdk && npx cdk deploy --all --require-approval never

      - name: Build web app
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ secrets.VITE_COGNITO_REGION }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_MEDIA_BUCKET_URL: ${{ secrets.VITE_MEDIA_BUCKET_URL }}
        run: pnpm --filter @social-lead-gen/web run build

      - name: Deploy to S3
        run: aws s3 sync apps/web/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
